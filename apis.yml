aid: plumerai
name: Plumerai
description: >-
  Plumerai builds AI software for intelligent cameras that pairs tiny on-device edge AI models with
  cloud Vision Language Models (VLMs). Its Video Intelligence products cover detection of people,
  vehicles, animals and packages, Familiar Face Identification, cross-camera Re-Identification,
  noise-robust motion detection, VLM-based video search, and custom AI notifications. The Plumerai
  Inference Engine is a deep-learning model compiler and runtime optimized for CPU inference on Arm
  Cortex-M / Cortex-A, RISC-V and x86_64. Plumerai integrates via SDKs (C++, C, Python, Rust, Java)
  rather than a hosted REST API, with the same unified API running from microcontrollers to servers.
  Plumerai also maintains the open-source Larq ecosystem for training and running Binarized Neural
  Networks.
